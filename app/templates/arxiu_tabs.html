<script>
  // Preferències de visualització (detalls, edició) abans de pintar res, per evitar salts
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('arxiu.ui.v1') || '{}');
      if (p.details) document.body.classList.add('ax-details');
      if (p.edit) document.body.classList.add('ax-edit');
    } catch (e) { /* ignora */ }
  })();
</script>
<nav class="changes-tabs arxiu-tabs" aria-label="Seccions de l'arxiu">
  <a href="{{ request.url_for('arxiu_route') }}" class="changes-tab{% if view == 'inici' %} active{% endif %}" {% if view == 'inici' %}aria-current="page"{% endif %}>Arxiu</a>
  <a href="{{ request.url_for('arxiu_arbre_route') }}" class="changes-tab{% if view == 'arbre' %} active{% endif %}" {% if view == 'arbre' %}aria-current="page"{% endif %}>Arbre de destí</a>
  <a href="{{ request.url_for('arxiu_cobertura_route') }}" class="changes-tab{% if view == 'cobertura' %} active{% endif %}" {% if view == 'cobertura' %}aria-current="page"{% endif %}>Cobertura</a>
  <a href="{{ request.url_for('arxiu_pendents_route') }}" class="changes-tab{% if view == 'pendents' %} active{% endif %}" {% if view == 'pendents' %}aria-current="page"{% endif %}>Pendents{% if n_pending is defined and n_pending %} <b class="ax-tab-count">{{ n_pending }}</b>{% endif %}</a>
  <span class="ax-actionsbar">
    <span class="ax-switches" role="group" aria-label="Visualització">
      <button type="button" class="ax-switch" id="ax-sw-details" aria-pressed="false" title="Mostra també els camps per executar: destí, nota, ruta de destí, nombre de fitxers i els comptadors per paper">detalls</button>
      <button type="button" class="ax-switch" id="ax-sw-edit" aria-pressed="false" title="Mostra els botons d'acció i permet editar en línia; desactivat, només es mira">edició</button>
    </span>
    <button type="button" class="btn btn-sm ax-action" id="ax-undo" {% if not last_action %}disabled{% endif %} title="{% if last_action %}Desfés: {{ last_action.summary }}{% else %}No hi ha cap acció per desfer{% endif %}">Desfés</button>
    <span id="ax-last" class="muted ax-last ax-action">{% if last_action %}{{ last_action.summary }}{% endif %}</span>
    <button type="button" class="ax-link" id="ax-log-toggle" title="Darreres accions">registre</button>
    <span id="ax-msg" class="ax-msg" hidden></span>
  </span>
</nav>
<div id="ax-log" class="ax-log" hidden></div>
<div id="ax-menu" class="explorer-menu" role="menu" hidden></div>
<div id="ax-toast" class="ax-toast" role="status" aria-live="polite" hidden></div>
<dialog id="ax-dialog" class="ax-dialog" aria-labelledby="ax-dialog-title">
  <form method="dialog">
    <h2 id="ax-dialog-title" class="ax-dialog-title"></h2>
    <div id="ax-dialog-body" class="ax-dialog-body"></div>
    <div class="ax-dialog-actions">
      <button type="submit" value="cancel" class="btn btn-sm" id="ax-dialog-cancel" autofocus>Cancel·la</button>
      <button type="submit" value="ok" class="btn btn-sm btn-delete" id="ax-dialog-ok">Esborra</button>
    </div>
  </form>
</dialog>
<datalist id="ax-spaces"></datalist>
<script type="application/json" id="ax-spaces-json">{{ spaces_json | safe }}</script>
<script type="application/json" id="ax-config">{"api": "/api/arxiu", "roles": {{ roles | tojson }}, "kinds": {{ kinds | tojson }}, "parents": {{ archive_parents | tojson }}, "roleShort": {{ role_short | tojson }}, "urls": {"explorador": "{{ request.url_for('explorador_route') }}", "cobertura": "{{ request.url_for('arxiu_cobertura_route') }}", "arbre": "{{ request.url_for('arxiu_arbre_route') }}"}}</script>
